name: E2E

on:
  push: # temporary: registers this workflow with GitHub so workflow_dispatch stops 404ing; reverted after
  workflow_call:
    inputs:
      image:
        description: Judge image to run the suite in
        type: string
        default: ghcr.io/dodona-edu/dodona-python:latest
      ref:
        description: judge-turtle ref to test
        type: string
        default: main
  workflow_dispatch:
    inputs:
      image:
        description: Judge image to run the suite in
        type: string
        default: ghcr.io/dodona-edu/dodona-python:latest
      ref:
        description: judge-turtle ref to test
        type: string
        default: main

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' # temporary, see the push trigger above
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user root

    steps:
      - uses: actions/checkout@v7
        with:
          repository: dodona-edu/judge-turtle
          ref: ${{ inputs.ref }}
      - name: Install test dependencies
        run: ./devel/install_test_deps.sh
      - name: Run tests
        run: ./devel/run-tests.sh
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
