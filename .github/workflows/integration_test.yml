name: Integration test

on:
  push:

jobs:
  test:
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.sha }}

  requirements-match-image:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dodona-edu/dodona-python:latest
      options: --user root

    steps:
      - uses: actions/checkout@v7
      - name: Compare requirements.txt against the image's dependency list
        run: ./devel/requirements_delta.sh --fail

  # codecov-action needs curl and gpg. They happen to be in this image, but we'd
  # rather not depend on the environment the test is meant to exercise shipping them.
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Code Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
