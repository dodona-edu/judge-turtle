[tool.coverage.run]
omit = [
    ".github/*",
    "htmlcov/*",
    "*/site-packages/*",
    "tests/*",
    "venv/*",
]
source = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["tests/e2e_repos"]
# Keep in step with .tool-versions; ruff defaults to py310 and can't infer it without a [project] table.
target-version = "py312"

[tool.ruff.lint]
# Opt out rather than opt in, so new ruff rules arrive enabled instead of staying off unnoticed.
# PYI036 lives in here now: it guards the __exit__ signatures whose missing `| None` made every
# Dodona 'with' block fail a type checker's context manager check.
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # this repo has no copyright headers
    "ANN401",  # **kwargs: Any is legitimate on the Dodona command constructors
    "N818",    # DodonaException reaches student feedback by name, renaming it changes that output
    "S101",    # the two asserts are startup invariants and the judge never runs under -O
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignores rather than an exclude, so `ruff format` still applies to the tests.
# pylama skipped them outright, so this is no less coverage than before.
"tests/*" = ["ALL"]

[[tool.ty.overrides]]
include = ["judge/runtime_patch.py"]
# This module swaps attributes on live stdlib modules (turtle, time, io, sys.stdin) and hands the
# submission a fake. A type checker models a module as a static namespace, so every patch line
# reads as an error. All 17 of ty's diagnostics on this tree are in here, and they are the point
# of the file rather than bugs in it. Everything else is checked normally.

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
