[tool.coverage.run]
omit = [
    ".github/*",
    "htmlcov/*",
    "*/site-packages/*",
    "tests/*",
    "venv/*",
]
source = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["tests/e2e_repos"]
# Keep in step with .tool-versions; ruff defaults to py310 and can't infer it without a [project] table.
target-version = "py312"

[tool.ruff.lint]
# Opt out rather than opt in, so new ruff rules arrive enabled instead of staying off unnoticed.
# PYI036 lives in here now: it guards the __exit__ signatures whose missing `| None` made every
# Dodona 'with' block fail a type checker's context manager check.
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # this repo has no copyright headers
    "ANN401",  # **kwargs: Any is legitimate on the Dodona command constructors
    "N818",    # DodonaException reaches student feedback by name, renaming it changes that output
    "S101",    # the two asserts are startup invariants and the judge never runs under -O
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignores rather than an exclude, so `ruff format` still applies to the tests.
# pylama skipped them outright, so this is no less coverage than before.
"tests/*" = ["ALL"]

[tool.mypy]
# pylama ran mypy with --ignore-missing-imports folded in, which is why the blanket `# noqa`
# comments on these imports used to be enough. Standalone mypy needs it said out loud, and
# naming the modules beats a global switch: a new untyped dependency should be a decision.
[[tool.mypy.overrides]]
module = ["svg_turtle.*", "cairosvg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "judge.runtime_patch"
# This module's whole job is to swap attributes on live stdlib modules (turtle, time, io, sys.stdin)
# and hand the submission a fake. mypy models a module as a static namespace, so every patch line
# reads as an error. Adding return annotations made mypy start checking these bodies, which it
# skipped while they were unannotated, so the findings are pre-existing rather than new.
# Narrowed to the three codes dynamic patching produces instead of switching the file off.
disable_error_code = ["assignment", "attr-defined", "index"]
